name: dbt CI

on:
  pull_request:
    branches:
      - master
    paths:
      - "zillow_transformation/**"
      - "scripts/python/**"
      - "scripts/sql/**"
      - "dags/**"
      - ".github/workflows/ci.yml"
      - ".github/workflows/deploy_prod.yml"
      - ".github/workflows/scheduled_orchestration.yml"
      - "Dockerfile"
      - "docker-compose.yaml"
      - "pyproject.toml"
      - "uv.lock"

env:
  SUPABASE_DB_HOST: ${{ secrets.SUPABASE_DB_HOST }}
  SUPABASE_DB_PORT: ${{ secrets.SUPABASE_DB_PORT }}
  SUPABASE_DB_USER: ${{ secrets.SUPABASE_DB_USER }}
  SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
  SUPABASE_DB_NAME: ${{ secrets.SUPABASE_DB_NAME }}
  SUPABASE_DB_SSLMODE: ${{ secrets.SUPABASE_DB_SSLMODE }}
  SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
  SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
  SUPABASE_STORAGE_BUCKET: ${{ secrets.SUPABASE_STORAGE_BUCKET }}

jobs:
  lint:
    name: Lint / Compile
    runs-on: ubuntu-latest
    env:
      CI_RUN_ID: ${{ github.run_id }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v4
        with:
          enable-caching: true

      - name: Install dependencies
        run: uv sync --group dbt

      - name: Configure dbt profile
        run: |
          mkdir -p ~/.dbt
          cp zillow_transformation/profiles.yml.example ~/.dbt/profiles.yml

      - name: Install dbt packages
        working-directory: zillow_transformation
        run: uv run dbt deps

      - name: Compile project for CI target
        working-directory: zillow_transformation
        run: uv run dbt compile --target ci

  test:
    name: State-based Test
    runs-on: ubuntu-latest
    needs: lint
    env:
      CI_RUN_ID: ${{ github.run_id }}
      PGPASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v4
        with:
          enable-caching: true

      - name: Install dependencies
        run: uv sync --group dbt

      - name: Configure dbt profile
        run: |
          mkdir -p ~/.dbt
          cp zillow_transformation/profiles.yml.example ~/.dbt/profiles.yml

      - name: Download prod manifest baseline
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: dbt-manifest-prod
          path: prod-manifest

      - name: Check prod manifest availability
        id: manifest_check
        run: |
          if [ -f prod-manifest/manifest.json ]; then
            echo "has_manifest=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_manifest=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Install dbt packages
        working-directory: zillow_transformation
        run: uv run dbt deps

      - name: Seed CI schema
        working-directory: zillow_transformation
        run: uv run dbt seed --target ci

      - name: Build modified graph in CI (state-aware)
        if: steps.manifest_check.outputs.has_manifest == 'true'
        working-directory: zillow_transformation
        run: uv run dbt run --select state:modified+ --state ../prod-manifest --defer --target ci --full-refresh

      - name: Test modified graph in CI (state-aware)
        if: steps.manifest_check.outputs.has_manifest == 'true'
        working-directory: zillow_transformation
        run: uv run dbt test --select state:modified+ --state ../prod-manifest --target ci

      - name: Bootstrap CI build when no prod manifest exists
        if: steps.manifest_check.outputs.has_manifest == 'false'
        working-directory: zillow_transformation
        run: uv run dbt run --target ci --full-refresh

      - name: Bootstrap CI tests when no prod manifest exists
        if: steps.manifest_check.outputs.has_manifest == 'false'
        working-directory: zillow_transformation
        run: uv run dbt test --target ci

      - name: Drop CI schemas
        if: always()
        run: |
          psql -h "${SUPABASE_DB_HOST}" -p "${SUPABASE_DB_PORT}" -U "${SUPABASE_DB_USER}" -d "${SUPABASE_DB_NAME}" -v ON_ERROR_STOP=1 -c "drop schema if exists ci_${CI_RUN_ID}_silver cascade;"
          psql -h "${SUPABASE_DB_HOST}" -p "${SUPABASE_DB_PORT}" -U "${SUPABASE_DB_USER}" -d "${SUPABASE_DB_NAME}" -v ON_ERROR_STOP=1 -c "drop schema if exists ci_${CI_RUN_ID}_gold cascade;"
