[project]
name = "real-estate-transformation"
version = "0.1.0"
description = "Zillow real estate analytics pipeline with dbt, Airflow, and Streamlit"
requires-python = ">=3.9"
dependencies = [
    "python-dotenv>=1.0.1",
    "pandas>=2.0.0",
    "numpy>=1.24.0",
    "supabase>=2.28.0",
    "psycopg2-binary>=2.9.11",
]

[dependency-groups]
streamlit = [
    "plotly>=5.20.0",
    "statsmodels>=0.14.0",
    "streamlit>=1.32.0",
]
dbt = [
    "dbt-core==1.10.11",
    "dbt-postgres==1.9.1",
    "dbt-adapters==1.16.7",
    "dbt-common==1.31.0",
    "protobuf==6.32.1",
]
cosmos = [
    "astronomer-cosmos==1.8.2",
]
dev = [
    "ruff>=0.4.0",
]

[tool.uv]
package = false

[tool.ruff.lint]
ignore = ["E501"]
