name: dbt CI

on:
  pull_request:
    branches:
      - master
    paths:
      - "zillow_transformation/**"
      - "scripts/python/**"
      - "scripts/sql/**"
      - ".github/workflows/ci.yml"
      - ".github/workflows/cd.yml"
      - ".env.example"
      - "requirements.txt"

env:
  PYTHON_VERSION: "3.9"
  SUPABASE_DB_HOST: ${{ secrets.SUPABASE_DB_HOST }}
  SUPABASE_DB_PORT: ${{ secrets.SUPABASE_DB_PORT }}
  SUPABASE_DB_USER: ${{ secrets.SUPABASE_DB_USER }}
  SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
  SUPABASE_DB_NAME: ${{ secrets.SUPABASE_DB_NAME }}
  SUPABASE_DB_SSLMODE: ${{ secrets.SUPABASE_DB_SSLMODE }}
  SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
  SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
  SUPABASE_STORAGE_BUCKET: ${{ secrets.SUPABASE_STORAGE_BUCKET }}

jobs:
  lint:
    name: Lint / Compile
    runs-on: ubuntu-latest
    env:
      CI_RUN_ID: ${{ github.run_id }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install dbt-postgres pandas python-dotenv supabase psycopg2-binary

      - name: Configure dbt profile
        run: |
          mkdir -p ~/.dbt
          cp zillow_transformation/profiles.yml.example ~/.dbt/profiles.yml

      - name: Install dbt packages
        # WHY: Resolve package macros/dependencies before parsing/compiling.
        working-directory: zillow_transformation
        run: dbt deps

      - name: Compile project for CI target
        # WHY: Catch SQL/ref/config issues early without mutating warehouse tables.
        working-directory: zillow_transformation
        run: dbt compile --target ci

  test:
    name: State-based Test
    runs-on: ubuntu-latest
    needs: lint
    env:
      CI_RUN_ID: ${{ github.run_id }}
      DATABASE_URL: postgresql://${{ secrets.SUPABASE_DB_USER }}:${{ secrets.SUPABASE_DB_PASSWORD }}@${{ secrets.SUPABASE_DB_HOST }}:${{ secrets.SUPABASE_DB_PORT }}/${{ secrets.SUPABASE_DB_NAME }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install dbt-postgres pandas python-dotenv supabase psycopg2-binary

      - name: Configure dbt profile
        run: |
          mkdir -p ~/.dbt
          cp zillow_transformation/profiles.yml.example ~/.dbt/profiles.yml

      - name: Download prod manifest baseline
        # WHY: Compare PR changes against last known production graph/state.
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: dbt-manifest-prod
          path: prod-manifest

      - name: Check prod manifest availability
        id: manifest_check
        run: |
          if [ -f prod-manifest/manifest.json ]; then
            echo "has_manifest=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_manifest=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Install dbt packages
        working-directory: zillow_transformation
        run: dbt deps

      - name: Seed CI schema
        # WHY: Ensure deterministic reference/static data exists before model builds.
        working-directory: zillow_transformation
        run: dbt seed --target ci

      - name: Build modified graph in CI (state-aware)
        # WHY: Limit CI runtime to changed nodes while deferring unchanged parents to prod state.
        if: steps.manifest_check.outputs.has_manifest == 'true'
        working-directory: zillow_transformation
        run: dbt run --select state:modified+ --state ../prod-manifest --defer --target ci --full-refresh

      - name: Test modified graph in CI (state-aware)
        # WHY: Validate correctness only for impacted models to keep PR feedback fast.
        if: steps.manifest_check.outputs.has_manifest == 'true'
        working-directory: zillow_transformation
        run: dbt test --select state:modified+ --state ../prod-manifest --target ci

      - name: Bootstrap CI build when no prod manifest exists
        # WHY: First pipeline runs without prior prod state; build full CI graph to validate end-to-end.
        if: steps.manifest_check.outputs.has_manifest == 'false'
        working-directory: zillow_transformation
        run: dbt run --target ci --full-refresh

      - name: Bootstrap CI tests when no prod manifest exists
        # WHY: Ensure first-run PR validation still enforces data quality checks.
        if: steps.manifest_check.outputs.has_manifest == 'false'
        working-directory: zillow_transformation
        run: dbt test --target ci

      - name: Drop CI schemas
        if: always()
        # WHY: Prevent accumulation of per-run CI schemas and control warehouse clutter/cost.
        run: |
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -c "drop schema if exists ci_${CI_RUN_ID}_silver cascade;"
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -c "drop schema if exists ci_${CI_RUN_ID}_gold cascade;"
