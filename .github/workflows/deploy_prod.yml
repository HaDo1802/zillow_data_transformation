name: Production Deploy

on:
  push:
    branches:
      - master
    paths:
      - "zillow_transformation/**"
      - "scripts/python/**"
      - "scripts/sql/**"
      - "dags/**"
      - ".github/workflows/deploy_prod.yml"
      - ".github/workflows/ci.yml"
      - ".github/workflows/scheduled_orchestration.yml"
      - "Dockerfile"
      - "docker-compose.yaml"
      - "requirements.txt"
      - "requirements-dbt.txt"
      - "requirements-cosmos.txt"
  workflow_dispatch:

env:
  PYTHON_VERSION: "3.9"
  SUPABASE_DB_HOST: ${{ secrets.SUPABASE_DB_HOST }}
  SUPABASE_DB_PORT: ${{ secrets.SUPABASE_DB_PORT }}
  SUPABASE_DB_USER: ${{ secrets.SUPABASE_DB_USER }}
  SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
  SUPABASE_DB_NAME: ${{ secrets.SUPABASE_DB_NAME }}
  SUPABASE_DB_SSLMODE: ${{ secrets.SUPABASE_DB_SSLMODE }}
  SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
  SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
  SUPABASE_STORAGE_BUCKET: ${{ secrets.SUPABASE_STORAGE_BUCKET }}

jobs:
  deploy_changed_models:
    name: Deploy Changed Models
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install dbt-postgres pandas python-dotenv supabase==2.28.0 psycopg2-binary

      - name: Configure dbt profile
        run: |
          mkdir -p ~/.dbt
          cp zillow_transformation/profiles.yml.example ~/.dbt/profiles.yml

      - name: Download prod manifest baseline
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: dbt-manifest-prod
          path: prod-manifest

      - name: Check prod manifest availability
        id: manifest_check
        run: |
          if [ -f prod-manifest/manifest.json ]; then
            echo "has_manifest=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_manifest=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Install dbt packages
        working-directory: zillow_transformation
        run: dbt deps

      - name: Seed production schema
        working-directory: zillow_transformation
        run: dbt seed --target prod

      - name: Deploy modified graph to prod
        if: steps.manifest_check.outputs.has_manifest == 'true'
        working-directory: zillow_transformation
        run: dbt run --select state:modified+ --state ../prod-manifest --defer --target prod

      - name: Test modified graph in prod
        if: steps.manifest_check.outputs.has_manifest == 'true'
        working-directory: zillow_transformation
        run: dbt test --select state:modified+ --state ../prod-manifest --target prod

      - name: Bootstrap deploy when no prod manifest exists
        if: steps.manifest_check.outputs.has_manifest == 'false'
        working-directory: zillow_transformation
        run: dbt run --target prod

      - name: Bootstrap tests when no prod manifest exists
        if: steps.manifest_check.outputs.has_manifest == 'false'
        working-directory: zillow_transformation
        run: dbt test --target prod

      - name: Publish prod manifest baseline
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: dbt-manifest-prod
          path: zillow_transformation/target/manifest.json
          retention-days: 30
